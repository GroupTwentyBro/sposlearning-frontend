<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="/media/logo.svg">
    <title>Add Page – SPOŠLearning</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Fira+Code:wght@400;500;600&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/markdown/markdown.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/gfm/gfm.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/mode/overlay.min.js"></script>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js/dist/fuse.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script type="module" src="/js/index.js"></script>

    <link rel="stylesheet" href="/navbar.css" />
    <link href="/admin/add-page.css" rel="stylesheet" />
</head>

<body>

<div id="nav">
        <div id="nav-left">
            <div id="nav-icon"><span class="icon">book_2</span></div>
            <div id="nav-grade-select-container">
                <button id="nav-grade-select">
                    <span id="grade-text">1st Grade</span>
                    <span class="icon" id="grade-select-drop-icon">arrow_drop_down</span>
                </button>
                <div id="grade-menu" class="hidden">
                    <button id="first-button">1st Grade</button>
                    <button id="second-button">2nd Grade</button>
                    <button id="third-button">3rd Grade</button>
                    <button id="fourth-button">4th Grade</button>
                </div>
            </div>
            <div id="breadcrumbs">
                <div class="crumb-item"><a href="/">Home</a><span class="separator">/</span></div>
                <div class="crumb-item current-crumb"><span class="current">Add Page</span></div>
            </div>
        </div>
        <div id="search">
            <div id="search-box">
                <div id="search-icon"><span class="icon">search</span></div>
                <div id="search-input-div" style="flex:1;"><input id="search-input" type="text" placeholder="Search" />
                </div>
            </div>
            <div id="search-results-container" class="hidden"></div>
        </div>
        <div id="nav-right">
            <button id="login-button" class="nd"><span class="icon">login</span>Login</button>
            <div id="nav-profile">
                <button id="account-button">
                    <span class="icon">person</span>
                    <span id="account-button-name">Admin</span>
                    <span class="icon" id="account-button-drop-icon">arrow_drop_down</span>
                </button>
                <div id="account-menu" class="hidden">
                    <button id="dashboard-button" class="nd">Dashboard</button>
                    <button id="settings-button">Settings</button>
                    <button id="feedback-button">Send Feedback</button>
                    <hr />
                    <button id="logout-button">Logout</button>
                </div>
            </div>
        </div>
    </div>

<div id="editor-wrapper">

    <div id="metadata-panel">
        <div id="toc-section" class="panel-section">
                <div class="toc-header">
                    <h3>Table of Contents</h3>
                    <button id="toc-refresh-btn" class="btn-icon-small" title="Refresh from document">
                        <span class="icon">refresh</span>
                    </button>
                </div>
                <div id="toc-display">
                    <div id="toc-list"></div>
                </div>
            </div>

            <div class="panel-divider"></div>

        <div id="metadata-section" class="panel-section">
                <div class="metadata-section">
                    <div class="form-group">
                        <label for="article-title">Article Title</label>
                        <input type="text" id="article-title" class="form-input"
                            placeholder="e.g., Introduction to Arrays" required spellcheck="true" autocorrect="on" autocapitalize="sentences" />
                    </div>
                    <div class="form-group">
                        <label for="article-path">Path</label>
                        <input type="text" id="article-path" class="form-input" placeholder="e.g., /prg/arrays/"
                            required />
                        <small>Start and end with a slash</small>
                    </div>
                    <div class="form-group">
                        <label for="article-grade">Target Grade</label>
                        <select id="article-grade"
                            style="width:100%; height:40px; border-radius:10px; padding:0 12px; background:var(--surface-1); border:1px solid var(--border-color); color:var(--text-primary); outline:none;">
                            <option value="0">All Grades (0)</option>
                            <option value="1">1st Grade (1)</option>
                            <option value="2">2nd Grade (2)</option>
                            <option value="3">3rd Grade (3)</option>
                            <option value="4">4th Grade (4)</option>
                        </select>
                    </div>
                    <div class="form-group checkbox">
                        <input type="checkbox" id="article-admin" class="checkbox-input" />
                        <label for="article-admin" class="checkbox-label">Admin only</label>
                    </div>
                </div>
                <div class="metadata-actions">
                    <button id="save-draft-btn" class="btn btn-secondary">
                        <span class="icon">edit_note</span> Save Draft
                    </button>
                    <button id="publish-btn" class="btn btn-primary">
                        <span class="icon">publish</span> Publish Page
                    </button>
                </div>
            </div>
        </div>

    <div id="toolbar" class="toolbar">
            <div class="toolbar-group">
                <button class="toolbar-btn" id="btn-h1" title="Heading 1"><span class="icon">format_h1</span></button>
                <button class="toolbar-btn" id="btn-h2" title="Heading 2"><span class="icon">format_h2</span></button>
                <button class="toolbar-btn" id="btn-h3" title="Heading 3"><span class="icon">format_h3</span></button>
            </div>
            <div class="toolbar-divider"></div>
            <div class="toolbar-group">
                <button class="toolbar-btn" id="btn-bold" title="Bold"><span class="icon">format_bold</span></button>
                <button class="toolbar-btn" id="btn-italic" title="Italic"><span
                        class="icon">format_italic</span></button>
                <button class="toolbar-btn" id="btn-code" title="Inline Code"><span class="icon">code</span></button>
                <button class="toolbar-btn" id="btn-link" title="Link"><span class="icon">link</span></button>
            </div>
            <div class="toolbar-divider"></div>
            <div class="toolbar-group">
                <button class="toolbar-btn" id="btn-ul" title="Unordered List"><span
                        class="icon">format_list_bulleted</span></button>
                <button class="toolbar-btn" id="btn-ol" title="Ordered List"><span
                        class="icon">format_list_numbered</span></button>
                <button class="toolbar-btn" id="btn-codeblock" title="Code Block"><span
                        class="icon">terminal</span></button>
            </div>
            <div class="toolbar-divider"></div>
            <div class="toolbar-group">
                <button class="toolbar-btn" id="btn-image" title="Image"><span class="icon">image</span></button>
                <button class="toolbar-btn" id="btn-toc" title="Add TOC Marker"><span
                        class="icon">bookmark</span></button>
            </div>
            <div class="toolbar-divider"></div>
            <div class="toolbar-group">
                <button class="toolbar-btn" id="btn-discl" title="Disclaimer"><span class="icon">info</span></button>
                <button class="toolbar-btn" id="btn-hint" title="Hint"><span class="icon">help</span></button>
                <button class="toolbar-btn" id="btn-box" title="Box"><span class="icon">activity_zone</span></button>
            </div>
            <div class="toolbar-divider"></div>
            <div class="toolbar-group">
                <button class="toolbar-btn" id="btn-toc-manager" title="Manage TOC"><span
                        class="icon">toc</span></button>
            </div>
            <div class="toolbar-divider"></div>
            <div class="toolbar-group">
                <button class="toolbar-btn" id="btn-autocorrect" title="Autocorrect & Spellcheck"><span
                        class="icon">spellcheck</span></button>
            </div>
        </div>

    <div id="editor-container">
        <div id="editor-panel" class="panel">
                <textarea id="editor" placeholder="Start writing your article in Markdown…"></textarea>
            </div>

        <div id="preview-panel" class="panel hidden">
                <div id="preview-content"></div>
            </div>

        <button id="toggle-view" class="toggle-view-btn" title="Toggle Preview">
                <span class="icon" id="toggle-view-icon">preview</span>
            </button>
        </div>

    </div>

<div id="image-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Insert Image</h3>
                <button class="modal-close" id="image-modal-close"><span class="icon">close</span></button>
            </div>
            <div class="modal-body">
                <div class="upload-zone" id="upload-zone">
                    <span class="icon">cloud_upload</span>
                    <p>Drop image here or click to select</p>
                    <input type="file" id="image-input" class="hidden" accept="image/*" />
                </div>
                <div id="image-preview" class="hidden">
                    <img id="preview-img" src="" alt="Preview" />
                </div>
                <div class="image-settings">
                    <div class="setting-group">
                        <label for="img-alt">Alt Text</label>
                        <input type="text" id="img-alt" class="form-input" placeholder="Description of image" spellcheck="true" autocorrect="on" />
                    </div>
                    <div class="setting-group">
                        <label for="img-width">Width (% of content)</label>
                        <input type="number" id="img-width" class="form-input" value="100" min="10" max="100" />
                    </div>
                    <div class="setting-group">
                        <label for="img-height">Height (auto or px)</label>
                        <input type="text" id="img-height" class="form-input" placeholder="auto or 300px" />
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="image-modal-cancel">Cancel</button>
                <button class="btn btn-primary" id="image-modal-insert">Insert Image</button>
            </div>
        </div>
    </div>

<div id="link-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Insert Link</h3>
                <button class="modal-close" id="link-modal-close"><span class="icon">close</span></button>
            </div>
            <div class="modal-body">
                <div class="setting-group">
                    <label for="link-text">Link Text</label>
                    <input type="text" id="link-text" class="form-input" placeholder="Click here" spellcheck="true" autocorrect="on" />
                </div>
                <div class="setting-group">
                    <label for="link-url">URL</label>
                    <input type="url" id="link-url" class="form-input" placeholder="https://example.com" />
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="link-modal-cancel">Cancel</button>
                <button class="btn btn-primary" id="link-modal-insert">Insert Link</button>
            </div>
        </div>
    </div>

<div id="discl-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Insert Disclaimer</h3>
                <button class="modal-close" id="discl-modal-close"><span class="icon">close</span></button>
            </div>
            <div class="modal-body">
                <div class="setting-group">
                    <label for="discl-type">Type</label>
                    <select id="discl-type" class="form-input">
                        <option value="">Default</option>
                        <option value="important">Important (Red)</option>
                        <option value="important-green">Success (Green)</option>
                        <option value="warning">Warning (Yellow)</option>
                        <option value="info">Info (Blue)</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label for="discl-text">Text</label>
                    <textarea id="discl-text" class="form-input" placeholder="Your disclaimer text here"
                        rows="4" spellcheck="true" autocorrect="on"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="discl-modal-cancel">Cancel</button>
                <button class="btn btn-primary" id="discl-modal-insert">Insert</button>
            </div>
        </div>
    </div>

<div id="notification" class="notification hidden"></div>

<script type="module" src="/admin/js/add-page.js"></script>

</body>

</html>
